<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg_10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#083344" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <radialGradient id="stageGlow_10" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#67e8f9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="cinematicShine">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="600" height="800" fill="url(#bg_10)" />
  <circle cx="300" cy="360" r="280" fill="url(#stageGlow_10)" />

  <!-- Theatrical Double Border -->
  <rect x="16" y="16" width="568" height="768" rx="8" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="22" y="22" width="556" height="756" rx="6" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Top Banner: Production House & Release Year -->
  <g transform="translate(300, 52)" text-anchor="middle">
    <rect x="-180" y="-18" width="360" height="24" rx="4" fill="#000000" fill-opacity="0.55" stroke="#67e8f9" stroke-opacity="0.3" stroke-width="1"/>
    <text y="-2" font-family="'Trebuchet MS', sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#ffffff">ORIGINAL CINEMATHEQUE · 2008</text>
  </g>

  <!-- Director Banner -->
  <text x="300" y="90" font-family="Georgia, serif" font-size="12" font-style="italic" letter-spacing="2" fill="#67e8f9" text-anchor="middle" opacity="0.9">AN A. R. MURUGADOSS FILM · GEETHA ARTS</text>

  <!-- Star Cast Header -->
  <text x="300" y="112" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#e2e8f0" text-anchor="middle" filter="url(#cinematicShine)">AAMIR KHAN · ASIN · JIAH KHAN</text>

  <!-- Central Movie Visual Scene Graphics -->
  <g transform="translate(300, 310)">
    <!-- Aura disc backdrop -->
    <circle cx="0" cy="0" r="140" fill="#000000" fill-opacity="0.5" stroke="#67e8f9" stroke-width="2" stroke-dasharray="8 4" opacity="0.6" />
    <circle cx="0" cy="0" r="125" fill="#0891b2" fill-opacity="0.35" />

    <!-- Specific Iconic Visual Silhouette / Motif based on symbolType -->
    <!-- Ghajini Polaroid Camera & Memories -->
           <rect x="-45" y="-25" width="90" height="65" rx="6" fill="#0f172a" stroke="#67e8f9" stroke-width="2.5"/>
           <circle cx="0" cy="8" r="18" fill="#000" stroke="#67e8f9" stroke-width="2"/>
           <rect x="20" y="-18" width="12" height="6" fill="#f59e0b"/>
           <text y="75" font-family="Georgia, serif" font-size="11" font-weight="700" letter-spacing="3" fill="#67e8f9" text-anchor="middle">POLAROID MEMORIES · 2008</text>
  </g>

  <!-- Iconic Film Title Typography -->
  <g transform="translate(300, 520)" text-anchor="middle">
    <rect x="-240" y="-38" width="480" height="56" rx="10" fill="#000000" fill-opacity="0.75" stroke="#67e8f9" stroke-width="1.5"/>
    <text y="2" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" letter-spacing="4" fill="#ffffff" filter="url(#cinematicShine)">GHAJINI</text>
  </g>

  <!-- Tagline Banner -->
  <text x="300" y="562" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#67e8f9" text-anchor="middle" opacity="0.95">SOME MEMORIES NEVER DIE</text>

  <!-- Featured Song Badge -->
  <g transform="translate(300, 608)" text-anchor="middle">
    <rect x="-200" y="-16" width="400" height="42" rx="8" fill="#67e8f9" fill-opacity="0.15" stroke="#67e8f9" stroke-width="1"/>
    <text y="4" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#ffffff">♪ GUZARISH & KAISE MUJHE</text>
    <text y="20" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1" fill="#cbd5e1">SUNG BY JAVED ALI & BENNY DAYAL</text>
  </g>

  <!-- Composer & Lyricist credits -->
  <text x="300" y="668" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#e2e8f0" text-anchor="middle">MUSIC: A. R. RAHMAN · LYRICS: PRASOON JOSHI</text>

  <!-- Authentic Bollywood Theatrical Billing Block at Footer -->
  <g transform="translate(300, 715)">
    <!-- U/A Certificate Box -->
    <rect x="-250" y="-8" width="45" height="30" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="-227" y="12" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">U/A</text>

    <!-- Billing text block -->
    <text x="0" y="0" font-family="sans-serif" font-size="8" letter-spacing="2" fill="#94a3b8" text-anchor="middle">ORIGINAL MOTION PICTURE SOUNDTRACK · RECORDED IN DOLBY DIGITAL 5.1 STEREO</text>
    <text x="0" y="14" font-family="sans-serif" font-size="8" letter-spacing="2" fill="#94a3b8" text-anchor="middle">DISTRIBUTED ACROSS THEATRES NATIONWIDE · NOSTALGIA ENTERTAINMENT ARCHIVES</text>

    <!-- Audio Cassette / CD Box -->
    <rect x="205" y="-8" width="45" height="30" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
    <text x="227" y="4" font-family="sans-serif" font-size="7" font-weight="800" fill="#67e8f9" text-anchor="middle">AUDIO</text>
    <text x="227" y="16" font-family="sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">CD</text>
  </g>
</svg>